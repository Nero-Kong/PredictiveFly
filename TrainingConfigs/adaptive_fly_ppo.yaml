behaviors:
  AdaptiveFly:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 65536
      learning_rate: 1.5e-4
      beta: 2.0e-3
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 16
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 16000000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 250000
